<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HHEVIX dashboard</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#F6F5F2;color:#2A1C14;margin:0;padding:16px 16px 90px;line-height:1.5}
.wrap{max-width:900px;margin:auto}
h1{font-size:26px;margin:0}h2{font-size:19px;margin:28px 0 10px}
.card{background:#fff;border:1px solid #E3DED7;border-radius:8px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.full{grid-column:1/-1}.w2{grid-column:span 2}
label{font-size:12px;color:#6F6259;display:flex;flex-direction:column;gap:3px}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;font-size:16px;padding:9px;border:1px solid #D5CFC6;border-radius:4px;width:100%}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:#2A1C14}
button{font:inherit;padding:10px 16px;border:1px solid #2A1C14;background:#fff;border-radius:6px;cursor:pointer}
button.pri{background:#9A6A3A;border-color:#9A6A3A;color:#fff}
button.del{border-color:#A23B2A;color:#A23B2A}
.off{opacity:.55}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.im{width:92px;text-align:center;font-size:12px}
.im img{width:92px;height:92px;object-fit:cover;border-radius:4px;border:1px solid #D5CFC6;display:block}
.im button{padding:3px 6px;font-size:12px;margin-top:3px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E3DED7;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:5}
.bar button{font-size:17px;padding:12px 26px}
#msg{font-size:14px}
.ok{color:#2F7A3A}.bad{color:#A23B2A}
.chip{display:inline-flex;gap:6px;align-items:center;margin:0 8px 8px 0}
.chip input{width:160px}
#login{max-width:340px;margin:12vh auto;text-align:center}
.hint{font-size:13px;color:#6F6259}
</style>
</head>
<body>
<div id="login" class="card">
  <h1>HHEVIX</h1>
  <p class="hint">Dashboard login</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <p><button class="pri" id="go" style="width:100%">Log in</button></p>
  <p id="lmsg" class="bad"></p>
</div>

<div class="wrap" id="app" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>HHEVIX dashboard</h1><button id="out">Log out</button></div>
  <p class="hint">Change anything, then press <b>Publish changes</b> at the bottom. Your website updates in about a minute.</p>

  <h2>Contact settings</h2>
  <div class="card grid">
    <label class="w2">WhatsApp number with country code, no + or spaces (example 923001234567). Leave empty to hide WhatsApp.
      <input type="text" id="wa" inputmode="numeric" placeholder="923001234567"></label>
    <label class="full">Bulk order message shown on the website<textarea id="bulk" rows="2"></textarea></label>
  </div>

  <h2>Categories</h2>
  <div class="card"><div id="cats"></div>
    <div class="grid" style="margin-top:6px"><label class="w2">New category name<input type="text" id="newCat" placeholder="e.g. Card holders"></label>
    <div style="align-self:end"><button id="addCat">Add category</button></div></div>
  </div>

  <h2>Products</h2>
  <button class="pri" id="addP">Add new product</button>
  <div id="list"></div>
</div>

<div class="bar" id="bar" hidden><span id="msg"></span><button class="pri" id="pub">Publish changes</button></div>

<script>
var $=function(i){return document.getElementById(i)},S,PW=sessionStorage.getItem('hpw')||'';
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('item-'+Date.now())}
function num(v){return v===''||v==null?null:Number(v)}
function say(t,c){$('msg').textContent=t;$('msg').className=c||''}
function api(body){body.password=PW;return fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong');return j})})}

function login(){
  PW=$('pw').value||PW;$('lmsg').textContent='';
  api({action:'check'}).then(function(){sessionStorage.setItem('hpw',PW);return fetch('/api/store?t='+Date.now()).then(function(r){return r.json()})})
  .then(function(d){S=d;$('login').hidden=true;$('app').hidden=false;$('bar').hidden=false;draw()})
  .catch(function(e){sessionStorage.removeItem('hpw');$('lmsg').textContent=e.message;$('login').hidden=false});
}
$('go').onclick=login;$('out').onclick=function(){sessionStorage.removeItem('hpw');location.reload()};$('pw').onkeydown=function(e){if(e.key==='Enter')login()};
if(PW)login();

function draw(){
  $('wa').value=S.whatsapp||'';$('bulk').value=S.bulk||'';
  $('cats').innerHTML=S.categories.map(function(c,i){return '<span class="chip"><input type="text" data-c="'+i+'" value="'+esc(c.name)+'"><button class="del" data-dc="'+i+'">Remove</button></span>'}).join('');
  $('list').innerHTML=S.products.map(function(p,i){
    var opts=S.categories.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===p.cat?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
    var ims=(p.images||[]).map(function(s,k){return '<div class="im"><img src="'+esc(s)+'" alt=""><button data-cover="'+i+','+k+'">'+(k?'Make cover':'Cover')+'</button><button class="del" data-di="'+i+','+k+'">Remove</button></div>'}).join('');
    return '<div class="card'+(p.show===false?' off':'')+'" data-i="'+i+'"><div class="grid">'+
    '<label class="chk full"><input type="checkbox" data-f="show" '+(p.show!==false?'checked':'')+'> Show on website</label>'+
    '<label class="w2">Name<input type="text" data-f="name" value="'+esc(p.name)+'"></label>'+
    '<label>Category<select data-f="cat">'+opts+'</select></label>'+
    '<label>Price Rs. (empty = "Message for price")<input type="number" inputmode="numeric" data-f="price" value="'+(p.price==null?'':p.price)+'"></label>'+
    '<label>Old price Rs. (crossed out, optional)<input type="number" inputmode="numeric" data-f="was" value="'+(p.was==null?'':p.was)+'"></label>'+
    '<label>Stock left (0 = sold out, empty = no note)<input type="number" inputmode="numeric" data-f="stock" value="'+(p.stock==null?'':p.stock)+'"></label>'+
    '<label class="chk"><input type="checkbox" data-f="free" '+(p.free?'checked':'')+'> Free delivery</label>'+
    '<label class="full">Description<textarea rows="2" data-f="desc">'+esc(p.desc)+'</textarea></label>'+
    '<div class="full"><div class="imgs">'+ims+'</div><p><label class="hint">Add photos (pick one or many)<input type="file" accept="image/*" multiple data-up="'+i+'"></label></p></div>'+
    '<div class="full"><button class="del" data-dp="'+i+'">Delete product</button></div></div></div>';
  }).join('');
}
$('wa').oninput=function(){S.whatsapp=this.value.replace(/\D/g,'')};
$('bulk').oninput=function(){S.bulk=this.value};
$('cats').addEventListener('input',function(e){if(e.target.dataset.c!=null)S.categories[e.target.dataset.c].name=e.target.value});
$('list').addEventListener('input',function(e){
  var f=e.target.dataset.f,box=e.target.closest('.card');if(!f||!box)return;
  var p=S.products[box.dataset.i],t=e.target;
  if(f==='show'||f==='free')p[f]=t.checked;
  else if(f==='price'||f==='was'||f==='stock')p[f]=num(t.value);
  else p[f]=t.value;
  if(f==='show')box.classList.toggle('off',!t.checked);
});
document.addEventListener('click',function(e){
  var d=e.target.dataset,a;
  if(d.dp!=null&&confirm('Delete this product? (Or just untick "Show on website")')){S.products.splice(d.dp,1);draw()}
  if(d.dc!=null){var c=S.categories[d.dc];if(S.products.some(function(p){return p.cat===c.id}))alert('Move or delete the products in "'+c.name+'" first.');else{S.categories.splice(d.dc,1);draw()}}
  if(d.di){a=d.di.split(',');S.products[a[0]].images.splice(a[1],1);draw()}
  if(d.cover){a=d.cover.split(',');var im=S.products[a[0]].images;im.unshift(im.splice(a[1],1)[0]);draw()}
});
$('addCat').onclick=function(){var n=$('newCat').value.trim();if(!n)return;var id=slug(n);if(S.categories.some(function(c){return c.id===id}))id+='-'+Date.now()%1000;S.categories.push({id:id,name:n});$('newCat').value='';draw()};
$('addP').onclick=function(){S.products.unshift({id:'p-'+Date.now(),name:'New product',cat:S.categories[0]?S.categories[0].id:'',price:null,was:null,stock:null,free:false,show:false,desc:'',images:[]});draw();window.scrollTo(0,$('list').offsetTop-20)};

/* photo upload: shrink on the phone/computer first, then send */
function shrink(file){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var m=1400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.86))};
  im.onerror=function(){no(new Error('Could not read that photo'))};im.src=u})}
document.addEventListener('change',function(e){
  var i=e.target.dataset.up;if(i==null)return;var fs=Array.from(e.target.files),n=0;
  (function next(){if(!fs.length){say('Photos added. Press Publish changes.','ok');draw();return}
    var f=fs.shift();say('Uploading photo '+(++n)+'…');
    shrink(f).then(function(d){return api({action:'upload',data:d})}).then(function(r){S.products[i].images.push(r.url);next()}).catch(function(er){say(er.message,'bad');draw()})})();
});
$('pub').onclick=function(){
  $('pub').disabled=true;say('Publishing…');
  S.products.forEach(function(p){if(/^p-\d+$/.test(p.id))p.id=slug(p.name)+'-'+p.id.slice(2,8)});
  api({action:'save',store:S}).then(function(){say('Published! Your website updates in about a minute.','ok')}).catch(function(er){say(er.message,'bad')}).then(function(){$('pub').disabled=false});
};
</script>
</body>
</html>
